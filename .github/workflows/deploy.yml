name: Deploy FamilyTree to Cloudflare (Pages & Workers)

on:
  push:
    branches:
      - main

jobs:
  # =========================================================
  # 1. DATABASE MIGRATION (Supabase PostgreSQL via Prisma)
  # =========================================================
  database-sync:
    name: Sync Database Schema to Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Push Prisma Schema to Supabase
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          npx prisma db push --accept-data-loss
          npm run build
          node dist/utils/seed.js

  # =========================================================
  # 2. BACKEND DEPLOYMENT (Cloudflare Workers)
  # =========================================================
  backend-deploy:
    name: Deploy Backend to Cloudflare Workers
    runs-on: ubuntu-latest
    needs: database-sync
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          npm ci
          npx prisma generate

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.152.0'
          workingDirectory: 'backend'
          secrets: |
            DATABASE_URL
            JWT_SECRET
            SEPAY_API_KEY
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'family_tree_production_secret_2026' }}
          SEPAY_API_KEY: ${{ secrets.SEPAY_API_KEY }}

  # =========================================================
  # 3. FRONTEND DEPLOYMENT (Cloudflare Pages)
  # =========================================================
  frontend-deploy:
    name: Build & Deploy Frontend to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: backend-deploy
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.BACKEND_API_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'AIzaSyCis4Z1KoowS4WdweThx2qrR7_UEwL32Lg' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'fam3-fam3.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'fam3-fam3' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'fam3-fam3.firebasestorage.app' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '637965754376' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || '1:637965754376:web:646ecb46f6551047a831bd' }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID || 'G-ED5GG39XGD' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://ggefsinnmmrfcfvyhvko.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.152.0'
          preCommands: npx wrangler pages project create famlykin --production-branch=main || true
          command: pages deploy frontend/dist --project-name=famlykin --branch=main
