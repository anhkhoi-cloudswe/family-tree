services:
  postgres:
    image: postgres:15-alpine
    container_name: familytree_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: familytree
      POSTGRES_PASSWORD: familytree_pass_2026
      POSTGRES_DB: familytree_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - familytree_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familytree -d familytree_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: familytree_backend
    restart: unless-stopped
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://familytree:familytree_pass_2026@postgres:5432/familytree_db?schema=public
      - JWT_SECRET=family_tree_secret_key_production_2026
      - STORAGE_TYPE=local
    volumes:
      - backend_uploads:/app/uploads
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - familytree_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: familytree_frontend
    restart: unless-stopped
    ports:
      - "8088:80"
    depends_on:
      - backend
    networks:
      - familytree_network

networks:
  familytree_network:
    driver: bridge

volumes:
  postgres_data:
  backend_uploads:
